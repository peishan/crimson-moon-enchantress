<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Crimson Moon's Enchantress</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5a1420">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Crimson Moon"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css"></head><body>
<div id="intro" onclick="skipIntro()" aria-label="The Crimson Moon's Enchantress — tap to skip">
  <img class="intro-art" src="assets/splash.webp" alt="The Crimson Moon's Enchantress — 绯月妖姬. A game adaptation by Yuchen Sky">
  <span class="intro-skip">tap to continue</span>
</div>
<div id="landing">
  <img class="landing-cover" src="assets/volume1_cover.webp" alt="The Long Awaited Love Is Not a Dream — Volume 1">
  <p class="landing-sub">The Crimson Moon's Enchantress · 绯月妖姬</p>
  <p class="landing-quote">"Fate bound by moons, trials, and a love beyond time."</p>
  <button id="contbtn" class="btn-begin" style="display:none" onclick="enter(false)">Continue Journey</button>
  <button id="newbtn" class="btn-begin" onclick="enter(true)">New Journey</button>
  <input type="file" id="landingImport" accept=".json,application/json" style="display:none" onchange="importSave(event,true)">
  <button class="btn-continue" onclick="document.getElementById('landingImport').click()">📥 Import Save File</button>
  <p id="contnote" class="landing-quote" style="display:none;margin:2px 0 0;font-size:.85rem">A saved journey was found in this browser.</p>
  <div class="ver"></div>
</div>
<div id="app">
  <div id="top"><span class="brand">CRIMSON MOON</span><span class="pill" id="hch"></span><span class="pill day" id="hday"></span><span class="pill gold" id="hgold"></span><button onclick="save();toast('Saved')" title="Save">💾</button></div>
  <div id="nav"></div><div id="main"></div><div class="ver"></div>
</div>
<div id="story" aria-modal="true"></div>
<div id="toast"></div>
<script>
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
/* a missing party portrait shows the character's emoji instead of a broken image */
window.addEventListener("error", e => { const t = e.target;
  if(!t || t.tagName!=="IMG" || t.dataset.fb || !/assets\/party\/[a-z]+\.webp/.test(t.src)) return;
  const id = t.src.match(/assets\/party\/([a-z]+)\.webp/)[1], c = (typeof CHARACTERS!=="undefined" && CHARACTERS[id]) || {icon:"?"};
  t.dataset.fb = 1; t.src = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="#2a1418"/><text x="32" y="43" font-size="34" text-anchor="middle">'+c.icon+'</text></svg>'); }, true);
/* cache version shown at the bottom of the page (the service worker's cache name) */
function showCacheVersion(){
  const set = t => document.querySelectorAll(".ver").forEach(e => e.textContent = t);
  if(!window.caches){ set(""); return; }
  caches.keys().then(ks => { const v = ks.filter(k => k.indexOf("crimson-moon-")===0).sort().pop(); set(v ? "Cache version: "+v : "Cache version: none yet (reload once)"); }).catch(() => set(""));
}
window.addEventListener("load", () => { showCacheVersion(); setTimeout(showCacheVersion, 2500); setTimeout(skipIntro, 2800); });
/* the game-title splash plays first, then the Volume 1 cover; tap to skip */
function skipIntro(){ const i = document.getElementById("intro"); if(!i || i.classList.contains("out")) return; i.classList.add("out"); setTimeout(() => i.remove(), 700); }
</script>
<script src="scripts/characters.js"></script>
<script src="scripts/chapters.js"></script>
<script src="scripts/script.js"></script>
<script src="scripts/people.js"></script>
<script src="scripts/core.js"></script>
<script src="scripts/enemies.js"></script>
<script src="scripts/battle.js"></script>
<script src="scripts/journal.js"></script>
<script src="scripts/temple.js"></script>
<script src="scripts/savedata.js"></script>
<script src="scripts/storypopup.js"></script>
<script src="scripts/ui.js"></script>
</body></html>
